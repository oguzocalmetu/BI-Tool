version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vela-postgres
    environment:
      POSTGRES_DB: vela_bi
      POSTGRES_USER: vela
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vela_pass_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vela -d vela_bi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vela-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vela-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://vela:${POSTGRES_PASSWORD:-vela_pass_dev}@postgres:5432/vela_bi
      DATABASE_URL_SYNC: postgresql://vela:${POSTGRES_PASSWORD:-vela_pass_dev}@postgres:5432/vela_bi
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-prod}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32-chars-here}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-6}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://frontend"]'
    volumes:
      - ./backend:/app
      - upload_data:/tmp/vela-uploads
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vela-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data:
